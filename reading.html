<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading | Une vie pensée</title>
  <meta name="description" content="Une vie pensée | 审思而活。思考服务于行动。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: #1f2428;
      background: #fcfaf6;
      font-family: "Crimson Text", "Noto Serif SC", serif;
      line-height: 1.7;
    }

    .shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 16px 72px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      background: rgba(252, 250, 246, 0.95);
      backdrop-filter: blur(8px);
    }

    .topbar-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 14px 0;
      gap: 6px;
    }

    .nav-toggle {
      display: none;
      border: none;
      background: transparent;
      color: #1f2428;
      font-family: "Playfair Display", serif;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0;
    }

    .nav-close {
      display: none;
    }

    .logo-stack {
      text-align: center;
      font-family: "Playfair Display", serif;
      font-size: 20px;
      line-height: 1.5;
      letter-spacing: 0.15em;
      color: #1f2428;
      padding: 24px 0;
      width: 100%;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 16px 0;
      border-bottom: 4px double #1f2428;
    }

    .nav-overlay {
      display: none;
    }

    .nav a,
    .lang button {
      text-decoration: none;
      color: #1f2428;
      border: none;
      padding: 0;
      font-size: 13px;
      font-weight: 400;
      font-family: "Playfair Display", serif;
      background: transparent;
      cursor: pointer;
      letter-spacing: 0.08em;
      text-transform: capitalize;
      display: flex;
      flex-direction: row;
      align-items: baseline;
      gap: 8px;
      line-height: 1.2;
    }

    .nav a span {
      font-size: 11px;
      color: #575757;
      font-weight: 400;
      font-family: "Crimson Text", serif;
      letter-spacing: 0;
      text-transform: none;
    }

    .nav a:hover {
      opacity: 1;
      text-decoration: underline;
    }

    .lang button {
      font-size: 12px;
      font-family: "Crimson Text", serif;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .lang button:hover { opacity: 0.6; }
    .lang button.active { font-weight: 700; }

    .nav a:focus-visible,
    .lang button:focus-visible {
      outline: 2px solid #2b4c63;
      outline-offset: 2px;
    }

    .page-header {
      text-align: center;
      padding: 64px 0 48px;
      border-bottom: 4px double #1f2428;
    }

    .page-header h1 {
      margin: 0 0 10px;
      font-family: "Playfair Display", serif;
      font-size: 48px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #1f2428;
      line-height: 1.2;
    }

    .page-title-zh {
      display: block;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: none;
      color: #a8a8a8;
      margin-top: 6px;
    }

    .page-header .page-sub {
      font-size: 12px;
      color: #a8a8a8;
      font-family: "Crimson Text", serif;
      letter-spacing: 0;
    }

    .article-body {
      max-width: 700px;
      margin: 0 auto;
      padding: 56px 0;
    }

    .articles-list {
      display: flex;
      flex-direction: column;
      gap: 56px;
    }

    .article-item {
      border-bottom: 1px solid #e8e4de;
      padding-bottom: 56px;
    }

    .article-item:last-child {
      border-bottom: none;
    }

    .article-item h2 {
      margin: 0 0 8px;
      font-family: "Playfair Display", serif;
      font-size: 28px;
      font-weight: 700;
      color: #1f2428;
      line-height: 1.4;
    }

    .article-meta {
      font-size: 12px;
      color: #a8a8a8;
      margin-bottom: 20px;
      font-family: "Crimson Text", serif;
      letter-spacing: 0.05em;
    }

    .article-item p {
      margin: 0 0 20px;
      color: #1f2428;
      font-family: "Crimson Text", "Noto Serif SC", serif;
      font-size: 1.1rem;
      line-height: 1.8;
    }

    /* ── Book Grid ── */
    .reading-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      margin-top: 24px;
    }

    .book-card {
      display: flex;
      flex-direction: column;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .book-card:hover { transform: translateY(-3px); }

    .cover-wrapper {
      width: 100%;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      border-radius: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      margin-bottom: 14px;
      background: #e8e4de;
    }

    .cover-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 无封面时的大字占位 */
    .cover-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Playfair Display", "Crimson Text", serif;
      font-size: 5rem;
      font-weight: 900;
      color: rgba(31, 36, 40, 0.12);
      background: #ece9e3;
      user-select: none;
    }

    .book-info {
      position: relative;
      padding: 8px 4px 4px;
      overflow: hidden;
    }

    /* 大字底色装饰 */
    .bg-large-char {
      position: absolute;
      top: -4px;
      right: 4px;
      font-family: "Playfair Display", serif;
      font-size: 4.5rem;
      font-weight: 900;
      color: rgba(31, 36, 40, 0.06);
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .title-block {
      position: relative;
      z-index: 1;
      text-align: left;
    }

    .title-block .subtitle {
      margin: 0 0 4px;
      font-size: 0.8rem;
      color: #9a9a9a;
      font-family: "Crimson Text", serif;
      font-style: italic;
      letter-spacing: 0.03em;
    }

    .title-block .book-title {
      margin: 0 0 4px;
      font-family: "Crimson Text", "Noto Serif SC", serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #1f2428;
      line-height: 1.4;
    }

    .title-block .author {
      margin: 0;
      font-size: 0.85rem;
      color: #aaa;
      font-family: "Crimson Text", serif;
      font-style: italic;
    }

    .book-entry-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      color: #555;
      text-decoration: underline;
      font-family: "Crimson Text", serif;
      font-size: 0.88rem;
      transition: opacity 0.2s ease;
    }

    .book-entry-link:hover { opacity: 0.6; }
    .book-entry-link::after { content: "↗"; font-size: 0.85rem; }

    .reading-grid-loading {
      color: #9a9a9a;
      font-size: 0.95rem;
      font-style: italic;
      padding: 16px 0;
    }

    .cms-reading {
      margin-top: 36px;
      padding-top: 26px;
      border-top: 1px solid #e4ddd3;
    }

    .cms-reading h3 {
      margin: 0 0 8px;
      font-family: "Playfair Display", serif;
      font-size: 1.45rem;
      color: #1f2428;
    }

    .cms-reading .muted {
      margin: 0 0 16px;
      color: #7c8087;
      font-size: 0.93rem;
    }

    .cms-reading-list {
      display: grid;
      gap: 12px;
    }

    .cms-reading-item {
      border: 1px solid #dfd8cd;
      background: #fffdf8;
      padding: 12px 14px;
    }

    .cms-reading-item h4 {
      margin: 0 0 4px;
      font-family: "Playfair Display", serif;
      font-size: 1.08rem;
    }

    .cms-reading-item p {
      margin: 0;
      color: #5f666d;
      font-size: 0.95rem;
      line-height: 1.66;
    }

    @media (max-width: 760px) {
      .reading-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
    }

    @media (max-width: 480px) {
      .reading-grid { grid-template-columns: 1fr; }
    }

    .article-item p:first-of-type::first-letter {
      float: left;
      font-family: "Playfair Display", serif;
      font-size: 4.2rem;
      font-weight: 700;
      line-height: 0.82;
      margin: 6px 10px 0 0;
      color: #1f2428;
    }

    .article-link {
      display: inline-block;
      color: #1f2428;
      text-decoration: underline;
      font-family: "Crimson Text", serif;
      font-size: 1rem;
      transition: opacity 0.2s ease;
    }

    .article-link:hover { opacity: 0.7; }

    /* 社交链接专用 */
    .social-links {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .social-links a {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 20px 0;
      border-bottom: 1px solid #e8e4de;
      text-decoration: none;
      color: #1f2428;
      font-family: "Playfair Display", serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.03em;
      transition: opacity 0.2s ease;
    }

    .social-links a:last-child { border-bottom: none; }
    .social-links a:hover { opacity: 0.6; }

    .social-links a span {
      font-family: "Crimson Text", serif;
      font-size: 13px;
      color: #a8a8a8;
      font-weight: 400;
      letter-spacing: 0;
    }

    .back-home {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 0 48px;
    }

    .back-home a {
      color: #a8a8a8;
      text-decoration: none;
      font-family: "Crimson Text", serif;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .back-home a:hover { color: #1f2428; }
    .back-home a::before { content: "←"; font-size: 1rem; }

    footer {
      padding-top: 20px;
      border-top: 1px solid #1f2428;
      text-align: center;
      color: #1f2428;
      font-size: 0.9rem;
      font-family: "Crimson Text", serif;
    }

    @media (max-width: 960px) {
      .logo-stack { font-size: 16px; }
      .nav { gap: 12px; }
      .article-body { padding: 40px 0; }
    }

    @media (max-width: 680px) {
      .topbar-header { justify-content: space-between; padding: 10px 0; }
      .nav-toggle { display: inline-block; }
      .logo-stack { font-size: 14px; padding: 16px 0; letter-spacing: 0.1em; }
      .nav {
        position: fixed;
        top: 0;
        left: 0;
        width: min(62vw, 260px);
        height: 100vh;
        flex-direction: column;
        flex-wrap: nowrap;
        align-items: flex-start;
        justify-content: flex-start;
        gap: 12px;
        padding: 84px 14px 20px;
        border-bottom: none;
        border-right: 1px solid #1f2428;
        background: #fcfaf6;
        transform: translateX(-110%);
        transition: transform 220ms cubic-bezier(0.2, 0.75, 0.3, 1);
        z-index: 25;
      }
      .nav a { font-size: 14px; }
      .nav a span { font-size: 12px; }
      .nav-close {
        display: inline-block;
        border: none;
        background: transparent;
        color: #1f2428;
        font-family: "Playfair Display", serif;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 0;
        margin-bottom: 8px;
        cursor: pointer;
      }
      body.nav-open .nav { transform: translateX(0); }
      .nav-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.2);
        z-index: 20;
      }
      body.nav-open .nav-overlay { display: block; }
      body.nav-open { overflow: hidden; }
      .page-header h1 { font-size: 32px; }
      .article-item h2 { font-size: 22px; }
    }
  </style>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-header">
        <button id="nav-toggle" class="nav-toggle" type="button" aria-controls="main-nav" aria-expanded="false">Menu</button>
        <div class="lang" aria-label="language switch">
          <button id="btn-zh" class="active" type="button">ZH</button>
          <button id="btn-en" type="button">EN</button>
          <button id="btn-fr" type="button">FR</button>
        </div>
      </div>
      <div class="logo-stack" data-zh="人们厌倦一切，除了懂得。" data-en="One grows weary of everything except knowing." data-fr="On se lasse de tout excepté de connaître.">On se lasse de tout excepté de connaître.</div>
      <nav id="main-nav" class="nav" aria-label="main navigation">
        <button id="nav-close" class="nav-close" type="button">Close</button>
        <a href="news.html" data-zh="新闻" data-en="News" data-fr="News">News<span data-zh="新闻" data-en="News" data-fr="News">新闻</span></a>
        <a href="travel.html" data-zh="旅行" data-en="Voyage" data-fr="Voyage">Voyage<span data-zh="旅行" data-en="Voyage" data-fr="Voyage">旅行</span></a>
        <a href="reading.html" data-zh="读书&文化" data-en="Books & Culture" data-fr="Books & Culture">Books & Culture<span data-zh="读书&文化" data-en="Books & Culture" data-fr="Books & Culture">读书&文化</span></a>
        <a href="social.html" data-zh="写作" data-en="Writing" data-fr="Writing">Writing<span data-zh="写作" data-en="Writing" data-fr="Writing">写作</span></a>
        <a href="french.html" data-zh="语言" data-en="Français" data-fr="Français">Français<span data-zh="法语" data-en="Français" data-fr="Français">法语</span></a>
        <a href="vibe.html" data-zh="AI编程" data-en="Vibe Coding" data-fr="Vibe Coding">Vibe Coding<span data-zh="AI编程" data-en="Vibe Coding" data-fr="Vibe Coding">AI编程</span></a>
      </nav>
      <div class="nav-overlay" id="nav-overlay"></div>
    </header>

    <div class="page-header">
      <h1>Reading<span class="page-title-zh">阅读</span></h1>
      <p class="page-sub" data-zh="书单、摘录与书评" data-en="Reading list, excerpts & reviews" data-fr="Livres, citations et critiques">书单、摘录与书评</p>
    </div>

    <div class="article-body">
      <main class="articles-list">
        <article class="article-item">
          <h2 data-zh="在读书单" data-en="Currently Reading" data-fr="En cours de lecture">在读书单</h2>
          <div class="article-meta" data-zh="每周更新" data-en="Updated weekly" data-fr="Mise à jour hebdomadaire">每周更新</div>

          <div id="reading-books-grid" class="reading-grid">
            <p class="reading-grid-loading">书单加载中...</p>
          </div>
        </article>

        <section class="cms-reading" aria-label="reading articles from cms">
          <h3>Reading Articles from CMS</h3>
          <p class="muted">Published entries from your FastAPI backend are rendered here.</p>
          <div id="reading-cms-articles" class="cms-reading-list"></div>
        </section>

      </main>
    </div>
    <div class="back-home">
      <a href="index.html" data-zh="返回首页" data-en="Back to home" data-fr="Retour à l'accueil">返回首页</a>
    </div>

    <footer id="footer-text">© 2026 Une vie pensée. Chez Meiya.</footer>
  </div>

  <script>
    const languageStore = {
      zh: { htmlLang: "zh-CN", pageTitle: "阅读", footer: "© 2026 Une vie pensée. Chez Meiya." },
      en: { htmlLang: "en", pageTitle: "Reading", footer: "© 2026 Une vie pensée. Chez Meiya." },
      fr: { htmlLang: "fr", pageTitle: "Lecture", footer: "© 2026 Une vie pensée. Chez Meiya." }
    };

    function setLanguage(lang) {
      const pack = languageStore[lang];
      document.documentElement.lang = pack.htmlLang;

      document.getElementById("footer-text").textContent = pack.footer;
      
      document.querySelectorAll("[data-zh][data-en][data-fr]").forEach((node) => {
        node.textContent = node.getAttribute(`data-${lang}`);
      });

      document.getElementById("btn-zh").classList.toggle("active", lang === "zh");
      document.getElementById("btn-en").classList.toggle("active", lang === "en");
      document.getElementById("btn-fr").classList.toggle("active", lang === "fr");
    }

    const navToggle = document.getElementById("nav-toggle");
    const navClose = document.getElementById("nav-close");
    const navOverlay = document.getElementById("nav-overlay");
    const navLinks = document.querySelectorAll("#main-nav a");

    function closeMobileNav() {
      document.body.classList.remove("nav-open");
      navToggle.setAttribute("aria-expanded", "false");
      navToggle.textContent = "Menu";
    }

    function openMobileNav() {
      document.body.classList.add("nav-open");
      navToggle.setAttribute("aria-expanded", "true");
      navToggle.textContent = "Close";
    }

    navToggle.addEventListener("click", () => {
      if (document.body.classList.contains("nav-open")) {
        closeMobileNav();
      } else {
        openMobileNav();
      }
    });

    navOverlay.addEventListener("click", closeMobileNav);
    navClose.addEventListener("click", closeMobileNav);
    navLinks.forEach((link) => link.addEventListener("click", closeMobileNav));

    document.addEventListener("click", (event) => {
      if (!document.body.classList.contains("nav-open")) {
        return;
      }
      if (event.target.closest("#main-nav") || event.target.closest("#nav-toggle")) {
        return;
      }
      closeMobileNav();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeMobileNav();
      }
    });

    window.matchMedia("(min-width: 681px)").addEventListener("change", (event) => {
      if (event.matches) {
        closeMobileNav();
      }
    });

    document.getElementById("btn-zh").addEventListener("click", () => setLanguage("zh"));
    document.getElementById("btn-en").addEventListener("click", () => setLanguage("en"));
    document.getElementById("btn-fr").addEventListener("click", () => setLanguage("fr"));

    async function loadReadingArticles() {
      const holder = document.getElementById("reading-cms-articles");
      if (!holder) return;

      holder.innerHTML = "<p class=\"muted\">Loading articles...</p>";
      try {
        const response = await fetch("/api/articles");
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const articles = await response.json();
        const published = Array.isArray(articles)
          ? articles.filter((item) => item.status === "published")
          : [];

        if (published.length === 0) {
          holder.innerHTML = "<p class=\"muted\">No published articles yet. Publish from /admin.</p>";
          return;
        }

        holder.innerHTML = published.slice(0, 8).map((item) => `
          <article class="cms-reading-item">
            <h4>${item.title || "Untitled"}</h4>
            <p>${item.summary || "No summary available."}</p>
          </article>
        `).join("");
      } catch (error) {
        holder.innerHTML = `<p class="muted">Could not load CMS articles (${error.message}).</p>`;
      }
    }

    async function loadReadingBooks() {
      const grid = document.getElementById("reading-books-grid");
      if (!grid) return;

      try {
        const res = await fetch("/api/reading-books");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const books = await res.json();

        if (!books.length) {
          grid.innerHTML = `<p class="reading-grid-loading" style="font-style:italic;color:#aaa;">书架正在整理中…</p>`;
          return;
        }

        grid.innerHTML = books.map(b => {
          const coverHtml = b.cover_image
            ? `<img src="${b.cover_image}" alt="${b.title}" loading="lazy" />`
            : `<div class="cover-placeholder">${b.first_char}</div>`;

          const linkOpen  = b.book_link ? `<a href="${b.book_link}" style="text-decoration:none;color:inherit;">` : `<div>`;
          const linkClose = b.book_link ? `</a>` : `</div>`;
          const entryLink = b.book_link
            ? `<a class="book-entry-link" href="${b.book_link}">进入专页</a>`
            : "";

          return `
          ${linkOpen}
          <div class="book-card">
            <div class="cover-wrapper">${coverHtml}</div>
            <div class="book-info">
              <span class="bg-large-char">${b.first_char}</span>
              <div class="title-block">
                ${b.subtitle ? `<p class="subtitle">${b.subtitle}</p>` : ""}
                <h3 class="book-title">${b.title}</h3>
                ${b.author ? `<p class="author">${b.author}</p>` : ""}
                ${entryLink}
              </div>
            </div>
          </div>
          ${linkClose}`;
        }).join("");

      } catch (err) {
        console.error("Failed to load reading books:", err);
        grid.innerHTML = `<p class="reading-grid-loading">书单暂时无法加载，请稍后再试。</p>`;
      }
    }

    loadReadingArticles();
    loadReadingBooks();
  </script>
</body>
</html>
